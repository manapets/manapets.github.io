<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Panel · ManáPets</title>
    <link rel="icon" href="/images/logo-mana-pet-shop.svg" />

    <!--
      Ruta ABSOLUTA del config. Sin esto, el panel resuelve "config.yml" de forma
      relativa a la URL: entrando a /admin (sin la barra final) la buscaba en
      /config.yml y daba "Failed to load config.yml (404)".
    -->
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />

    <style>
      /* Evita el parpadeo blanco mientras carga el panel. */
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #ffffff;
      }
    </style>
  </head>

  <body>
    <!--
      IMPORTANTE: el script va AL FINAL del <body>, no en el <head>.

      Decap CMS hace auto-init en el momento en que se evalúa el bundle. Si el
      <script> está en el <head>, todavía no existe document.body y la
      inicialización revienta: la página queda en blanco con el texto
      "Cargando administrador..." y SIN errores en la consola.

      Alternativa equivalente: dejarlo en el <head> con el atributo `defer`.
    -->
    <script src="https://unpkg.com/decap-cms@^3.17.1/dist/decap-cms.js"></script>
  </body>
</html>
