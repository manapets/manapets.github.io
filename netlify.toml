# Configuración de Netlify para publicar el sitio.
# Netlify lee este archivo automáticamente al conectar el repositorio de GitHub.
#
#   Comando de build : npm run build
#   Carpeta publicada: dist
#
# El panel de administración queda en /admin (se publica como archivo estático).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Los archivos con hash en el nombre (Astro los genera en /_astro) nunca cambian,
# así que se pueden cachear para siempre.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El panel de administración no debe quedar indexado en Google.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Si alguien entra a /admin sin la barra final, redirigir a /admin/.
# El panel resuelve el config de forma relativa y necesita la barra.
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301
